{% extends "base.html" %}
{% block title %}대시보드 - Building Twin{% endblock %}

{% block content %}
<div class="page-header">
  <h1>대시보드</h1>
  <p class="subtitle">고층 건물 외벽 창문 오염도 검사 시스템</p>
</div>

<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-number" id="stat-buildings">-</div>
    <div class="stat-label">등록 건물</div>
  </div>
  <div class="stat-card">
    <div class="stat-number" id="stat-inspections">-</div>
    <div class="stat-label">총 검사 횟수</div>
  </div>
  <div class="stat-card">
    <div class="stat-number" id="stat-windows">-</div>
    <div class="stat-label">분석된 창문</div>
  </div>
</div>

<div class="section">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px">
    <h2 style="margin:0">최근 검사 목록</h2>
    <a href="/viewer" class="btn btn-sm" style="background:#3a4a8a;color:#fff;text-decoration:none;padding:6px 14px;border-radius:6px">
      3D 뷰어 열기
    </a>
  </div>
  <table class="table" id="inspections-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>건물</th>
        <th>파일명</th>
        <th>창문 수</th>
        <th>오염 지수</th>
        <th>상태</th>
        <th>검사일시</th>
        <th>결과</th>
      </tr>
    </thead>
    <tbody id="inspections-body">
      <tr><td colspan="8" class="loading">불러오는 중...</td></tr>
    </tbody>
  </table>
</div>

<div class="section" style="margin-top:24px">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px">
    <h2 style="margin:0">창문 오염도 갤러리</h2>
    <small id="gallery-count" style="color:#666">로딩 중...</small>
  </div>
  <div id="window-gallery" style="display:flex; flex-wrap:wrap; gap:12px; padding:4px; min-height:80px">
    <p style="color:#666;padding:16px">로딩 중...</p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  async function loadDashboard() {
    const [buildings, inspections, windowResults] = await Promise.all([
      fetch('/api/buildings/').then(r => r.json()),
      fetch('/api/inspections/').then(r => r.json()),
      fetch('/analysis/windows').then(r => r.json()).catch(() => []),
    ]);

    document.getElementById('stat-buildings').textContent = buildings.length;
    document.getElementById('stat-inspections').textContent = inspections.length;

    const totalWindows = inspections.reduce((s, i) => s + (i.total_windows || 0), 0);
    document.getElementById('stat-windows').textContent = totalWindows;

    // inspection_id별 평균 pollution_index 계산
    const pollutionByInspection = {};
    windowResults.forEach(w => {
      const iid = w.inspection_id;
      if (!pollutionByInspection[iid]) pollutionByInspection[iid] = [];
      pollutionByInspection[iid].push(w.pollution_index ?? w.contamination_score ?? 0);
    });
    const avgPollution = {};
    for (const [iid, vals] of Object.entries(pollutionByInspection)) {
      avgPollution[iid] = (vals.reduce((s, v) => s + v, 0) / vals.length).toFixed(3);
    }

    const buildingMap = Object.fromEntries(buildings.map(b => [b.id, b.name]));
    const tbody = document.getElementById('inspections-body');
    if (inspections.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty">검사 기록이 없습니다.</td></tr>';
    } else {
      tbody.innerHTML = inspections.slice(0, 10).map(i => `
        <tr>
          <td>${i.id}</td>
          <td>${buildingMap[i.building_id] || '-'}</td>
          <td class="filename">${i.video_filename}</td>
          <td>${i.total_windows}</td>
          <td>${avgPollution[i.id] !== undefined ? avgPollution[i.id] : '-'}</td>
          <td><span class="badge badge-${i.status}">${i.status}</span></td>
          <td>${new Date(i.inspected_at).toLocaleString('ko-KR')}</td>
          <td><a href="/result/${i.id}" class="btn btn-sm">상세보기</a></td>
        </tr>
      `).join('');
    }

    // 갤러리는 inspections 유무와 무관하게 항상 렌더링
    renderWindowGallery(windowResults);
  }

  const GRADE_COLOR = { A:'#4caf50', B:'#ffeb3b', C:'#ff9800', D:'#f44336' };
  const GRADE_BG    = { A:'#1a4a1a', B:'#3a3a10', C:'#3a1a08', D:'#3a0808' };

  function renderWindowGallery(windowResults) {
    const galleryEl = document.getElementById('window-gallery');
    const cntEl     = document.getElementById('gallery-count');
    if (!galleryEl) return;

    cntEl.textContent = `${windowResults.length}개`;

    if (!windowResults.length) {
      galleryEl.innerHTML = '<p style="color:#666;padding:16px">크롭 이미지가 없습니다. pipeline/analyze.py 를 먼저 실행하세요.</p>';
      return;
    }

    // frame_number 1~27 (파일 존재) 우선, 최대 27개
    const items = windowResults.filter(w => w.frame_number >= 1 && w.frame_number <= 27)
                               .slice(0, 27);
    console.log(`[갤러리] ${items.length}개 | 첫 URL: /static/results/${items[0]?.window_id}_crop.jpg`);
    galleryEl.innerHTML = items.map(w => {
      const idx   = (w.pollution_index ?? 0).toFixed(3);
      const grade = w.grade ?? 'D';
      const color = GRADE_COLOR[grade] ?? '#aaa';
      const bg    = GRADE_BG[grade]   ?? '#333';
      return `
        <div style="width:180px;border-radius:8px;overflow:hidden;background:#1a1a26;border:1px solid #2a2a3a">
          <img src="http://localhost:8000/static/results/${w.window_id}_crop.jpg"
               style="width:100%;height:180px;object-fit:cover;border-radius:8px 8px 0 0;display:block;">
          <div style="padding:8px">
            <div style="font-size:11px;color:#aaa;margin-bottom:4px">${w.window_id}</div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:11px;color:#777">idx: ${idx}</span>
              <span style="padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:${bg};color:${color}">${grade}</span>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  loadDashboard().catch(err => {
    console.error('[대시보드] 로드 오류:', err);
    const galleryEl = document.getElementById('window-gallery');
    if (galleryEl) galleryEl.innerHTML = `<p style="color:#f44;padding:16px">로드 실패: ${err.message}</p>`;
  });
</script>
{% endblock %}
