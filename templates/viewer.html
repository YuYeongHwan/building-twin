<!DOCTYPE html>
<html>
<head>
  <title>3D 뷰어 - Building Twin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; }
    canvas { display: block; }
    #loading {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: white; font-size: 18px; font-family: Arial;
    }
    #error {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #ff4444; font-size: 16px; font-family: Arial;
      text-align: center; display: none;
    }
    #info {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      color: #aaa; font-size: 13px; font-family: Arial;
      background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px;
    }
    #back {
      position: fixed; top: 20px; left: 20px;
      color: white; text-decoration: none; font-family: Arial;
      background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 8px;
    }
    #window-list {
      position: fixed; top: 0; right: 0;
      width: 250px; height: 100vh;
      background: rgba(0,0,0,0.8);
      overflow-y: auto; padding: 16px;
      font-family: Arial; color: white;
    }
    .win-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid #333;
    }
    .win-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
    .grade-A { color: #4CAF50; }
    .grade-B { color: #2196F3; }
    .grade-C { color: #FF9800; }
    .grade-D { color: #f44336; }
  </style>
</head>
<body>
  <div id="loading">⏳ 3D 모델 로딩 중...</div>
  <div id="error"></div>
  <div id="info">드래그: 회전 | 휠: 줌 | 우클릭 드래그: 패닝</div>
  <a href="/dashboard" id="back">← 대시보드</a>

  <div id="legend" style="
    position:fixed; bottom:60px; left:20px;
    background:rgba(0,0,0,0.7); padding:12px 16px;
    border-radius:8px; font-family:Arial; font-size:13px;">
    <div style="color:white;margin-bottom:8px;font-weight:bold">범례</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
      <div style="width:12px;height:12px;background:#66ccff;border-radius:50%"></div>
      <span style="color:#aaa">창문 (흰색 영역)</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
      <div style="width:12px;height:12px;background:#999;border-radius:50%"></div>
      <span style="color:#aaa">외벽 경계</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:12px;height:12px;background:#555;border-radius:50%"></div>
      <span style="color:#aaa">외벽 (검정 폼보드)</span>
    </div>
  </div>
  <div id="window-list">
    <h3 style="margin-bottom:12px">창문 오염도 목록</h3>
    <div id="win-items">로딩 중...</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ── 창문 목록 로드 ──────────────────────────────────────
    fetch('/analysis/windows')
      .then(r => r.json())
      .then(data => {
        const container = document.getElementById('win-items');
        if (!data.length) { container.innerHTML = '데이터 없음'; return; }
        container.innerHTML = data.slice(0, 50).map(w => `
          <div class="win-item">
            <img class="win-thumb"
                 src="/static/results/${w.window_id}_crop.jpg"
                 onerror="this.style.display='none'">
            <div>
              <div style="font-size:13px">${w.window_id}</div>
              <div style="font-size:12px">idx: ${w.pollution_index?.toFixed(3)}</div>
              <div class="grade-${w.grade}" style="font-size:12px">등급 ${w.grade}</div>
            </div>
          </div>
        `).join('');
      });

    // ── Three.js 포인트 클라우드 뷰어 ───────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(
      60, (window.innerWidth - 250) / window.innerHeight, 0.1, 1000
    );
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth - 250, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // .splat 파일 로드: 32 bytes / Gaussian
    //   offset  0–11: position xyz (float32×3)
    //   offset 12–23: scale   xyz (float32×3)
    //   offset 24–27: color  rgba (uint8×4)
    //   offset 28–31: rotation wxyz (uint8×4)
    fetch('/models/splat')
      .then(r => {
        if (!r.ok) throw new Error('splat 파일 없음');
        return r.arrayBuffer();
      })
      .then(buffer => {
        document.getElementById('loading').style.display = 'none';

        const rowLength   = 3*4 + 3*4 + 4 + 4;   // 32 bytes (포맷 정의값)
        const vertexCount = Math.floor(buffer.byteLength / rowLength);
        const view        = new DataView(buffer);

        // 외벽 포인트 (어두운 색 → 검정 폼보드)
        const wallPositions = [];
        const wallColors    = [];

        // 창문 포인트 (밝은 색 → 흰색 A4용지)
        const windowPositions = [];
        const windowColors    = [];

        for (let i = 0; i < vertexCount; i++) {
          const offset = i * rowLength;
          try {
            const x = view.getFloat32(offset + 0,  true);
            const y = view.getFloat32(offset + 4,  true);
            const z = view.getFloat32(offset + 8,  true);
            const r = view.getUint8(offset + 24) / 255;
            const g = view.getUint8(offset + 25) / 255;
            const b = view.getUint8(offset + 26) / 255;
            const brightness = (r + g + b) / 3;

            if (brightness > 0.6) {
              // 밝은 포인트 → 창문 → 하늘색으로 강조
              windowPositions.push(x, y, z);
              windowColors.push(0.4, 0.8, 1.0);
            } else if (brightness > 0.2) {
              // 중간 밝기 → 외벽 경계 → 회색
              wallPositions.push(x, y, z);
              wallColors.push(0.6, 0.6, 0.6);
            } else {
              // 어두운 포인트 → 검정 폼보드 외벽 → 짙은 회색
              wallPositions.push(x, y, z);
              wallColors.push(0.3, 0.3, 0.3);
            }
          } catch(e) { continue; }
        }

        // 외벽 렌더링
        const wallGeo = new THREE.BufferGeometry();
        wallGeo.setAttribute('position', new THREE.Float32BufferAttribute(wallPositions, 3));
        wallGeo.setAttribute('color',    new THREE.Float32BufferAttribute(wallColors,    3));
        scene.add(new THREE.Points(wallGeo, new THREE.PointsMaterial({ size: 0.015, vertexColors: true })));

        // 창문 렌더링 (더 크고 밝게)
        const winGeo = new THREE.BufferGeometry();
        winGeo.setAttribute('position', new THREE.Float32BufferAttribute(windowPositions, 3));
        winGeo.setAttribute('color',    new THREE.Float32BufferAttribute(windowColors,    3));
        scene.add(new THREE.Points(winGeo, new THREE.PointsMaterial({ size: 0.03, vertexColors: true })));

        // 포인트 클라우드 중심 계산 → 카메라 자동 배치
        const allPos = [...wallPositions, ...windowPositions];
        const count  = allPos.length / 3;
        let cx = 0, cy = 0, cz = 0;
        for (let i = 0; i < allPos.length; i += 3) {
          cx += allPos[i]; cy += allPos[i+1]; cz += allPos[i+2];
        }
        cx /= count; cy /= count; cz /= count;

        let maxDist = 0;
        for (let i = 0; i < allPos.length; i += 3) {
          const d = Math.sqrt(
            (allPos[i]-cx)**2 + (allPos[i+1]-cy)**2 + (allPos[i+2]-cz)**2
          );
          if (d > maxDist) maxDist = d;
        }

        camera.position.set(cx, cy - maxDist * 0.5, cz + maxDist * 2);
        controls.target.set(cx, cy, cz);
        controls.update();

        console.log(`중심: (${cx.toFixed(2)}, ${cy.toFixed(2)}, ${cz.toFixed(2)}), 크기: ${maxDist.toFixed(2)}`);
        console.log(`전체: ${vertexCount}개 | 창문(하늘색): ${windowPositions.length/3}개 | 외벽(회색): ${wallPositions.length/3}개`);

        // 위험 등급 창문 통계
        fetch('/analysis/windows')
          .then(r => r.json())
          .then(windows => {
            const critical = windows.filter(w => w.grade === 'D');
            console.log(`위험 등급 창문(D): ${critical.length}개 / 전체: ${windows.length}개`);
          });

        // 재촬영 가이드
        console.log([
          '=== 3DGS 품질 개선을 위한 재촬영 가이드 ===',
          '1. 폼보드에 마스킹테이프나 스티커 패턴 붙이기 (필수)',
          '   → 검정 단색 면은 COLMAP 특징점 추출 불가',
          '2. 촬영 거리: 모형에서 30~50cm 유지',
          '3. 촬영 속도: 아주 천천히 (흔들림 최소화)',
          '4. 촬영 순서:',
          '   - 수평 360도 (40장)',
          '   - 위 45도 사선 360도 (40장)',
          '   - 아래 45도 사선 360도 (40장)',
          '   - 각 면 클로즈업 (30장)',
          '5. 조명: 직사광선 없는 실내, 균일한 조명',
          '총 목표: 150장 이상',
        ].join('\n'));
      })
      .catch(err => {
        document.getElementById('loading').style.display = 'none';
        const errDiv = document.getElementById('error');
        errDiv.style.display = 'block';
        errDiv.innerHTML = `모델 로드 실패<br><small>${err.message}</small><br><br>
          <small>pipeline/reconstruct.py 를 먼저 실행하세요.</small>`;
      });

    window.addEventListener('resize', () => {
      const w = window.innerWidth - 250;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
