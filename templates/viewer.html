<!DOCTYPE html>
<html>
<head>
  <title>3D 뷰어 - Building Twin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #2a2a2a; overflow: hidden; }
    #loading {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: white; font-size: 18px; font-family: Arial;
      text-align: center; line-height: 1.8;
    }
    #info {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      color: #aaa; font-size: 13px; font-family: Arial;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px; border-radius: 20px;
    }
    #back {
      position: fixed; top: 20px; left: 20px;
      color: white; text-decoration: none;
      font-family: Arial; font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px; border-radius: 8px;
      z-index: 100;
    }
    #stats {
      position: fixed; top: 20px; right: 270px;
      color: #aaa; font-size: 12px; font-family: Arial;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px; border-radius: 8px;
    }
    #window-list {
      position: fixed; top: 0; right: 0;
      width: 250px; height: 100vh;
      background: rgba(0,0,0,0.85);
      overflow-y: auto; padding: 16px;
      font-family: Arial; color: white;
    }
    .win-item {
      display: flex; align-items: center;
      gap: 10px; padding: 8px 0;
      border-bottom: 1px solid #333;
    }
    .win-thumb {
      width: 40px; height: 40px;
      object-fit: cover; border-radius: 4px;
    }
    .grade-A { color: #4CAF50; }
    .grade-B { color: #2196F3; }
    .grade-C { color: #FF9800; }
    .grade-D { color: #f44336; }
  </style>
</head>
<body>
  <div id="loading">⏳ 3D 모델 로딩 중...</div>
  <div id="info">드래그: 회전 | 휠: 줌 | 우클릭: 이동</div>
  <div id="stats"></div>
  <a href="/dashboard" id="back">← 대시보드</a>
  <div id="window-list">
    <h3 style="margin-bottom:12px; font-size:14px">창문 오염도 목록</h3>
    <div id="win-items">로딩 중...</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three'
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js'
    import { MTLLoader } from 'three/addons/loaders/MTLLoader.js'

    const loading = document.getElementById('loading')
    const stats = document.getElementById('stats')

    // Three.js 기본 세팅
    const scene = new THREE.Scene()
    scene.background = new THREE.Color(0x2a2a2a)

    const camera = new THREE.PerspectiveCamera(
      60, (window.innerWidth - 250) / window.innerHeight, 0.1, 100000
    )
    camera.position.set(0, 50, 100)

    const renderer = new THREE.WebGLRenderer({ antialias: true })
    renderer.setSize(window.innerWidth - 250, window.innerHeight)
    renderer.shadowMap.enabled = true
    document.body.appendChild(renderer.domElement)

    const controls = new OrbitControls(camera, renderer.domElement)
    controls.enableDamping = true
    controls.dampingFactor = 0.05

    // 조명
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6)
    scene.add(ambientLight)
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0)
    dirLight.position.set(100, 200, 100)
    scene.add(dirLight)
    const dirLight2 = new THREE.DirectionalLight(0x8888ff, 0.3)
    dirLight2.position.set(-100, 50, -100)
    scene.add(dirLight2)

    // 그리드
    const grid = new THREE.GridHelper(1000, 50, 0x444444, 0x333333)
    scene.add(grid)

    // fetch + parse 방식으로 로드
    async function loadModel() {
      try {
        // 1. mesh info 가져오기
        const info = await fetch('/models/mesh/info').then(r => r.json())
        const textureBase = info.texture_base

        // 2. MTL 로드
        loading.innerHTML = '⏳ MTL 재질 로딩 중...'
        const mtlText = await fetch(info.mtl_url).then(r => r.text())
        const mtlLoader = new MTLLoader()
        mtlLoader.setResourcePath(textureBase)
        const materials = mtlLoader.parse(mtlText, textureBase)
        materials.preload()

        // 3. OBJ 로드
        loading.innerHTML = '⏳ OBJ 모델 로딩 중...<br><small>31MB 파일, 잠시 기다려주세요</small>'
        const objText = await fetch(info.obj_url).then(r => r.text())

        // 4. OBJ 파싱
        loading.innerHTML = '⏳ 렌더링 준비 중...'
        const objLoader = new OBJLoader()
        objLoader.setMaterials(materials)
        const obj = objLoader.parse(objText)

        // 5. 와이어프레임 오버레이 추가
        obj.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true
            child.receiveShadow = true
            const wireGeo = new THREE.WireframeGeometry(child.geometry)
            const wireMat = new THREE.LineBasicMaterial({
              color: 0x888888,
              transparent: true,
              opacity: 0.2
            })
            scene.add(new THREE.LineSegments(wireGeo, wireMat))
          }
        })

        // 방향 보정 없이 원본 그대로 렌더링
        // 양면 렌더링만 적용
        obj.traverse(child => {
          if (child.isMesh) {
            if (Array.isArray(child.material)) {
              child.material.forEach(m => {
                m.side = THREE.DoubleSide
              })
            } else {
              child.material.side = THREE.DoubleSide
            }
          }
        })

        // 바운딩박스 기준 카메라 자동 조정
        obj.updateMatrixWorld(true)
        const box = new THREE.Box3().setFromObject(obj)
        const center = box.getCenter(new THREE.Vector3())
        const size = box.getSize(new THREE.Vector3())
        const maxDim = Math.max(size.x, size.y, size.z)

        obj.position.set(-center.x, -center.y, -center.z)
        controls.target.set(0, 0, 0)
        camera.position.set(maxDim, maxDim * 0.8, maxDim)
        controls.update()

        scene.add(obj)

        loading.style.display = 'none'
        stats.innerHTML =
          `크기: ${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)}`

      } catch(e) {
        loading.innerHTML = `❌ 로드 실패<br><small>${e.message}</small>`
        loading.style.color = 'red'
        console.error(e)
      }
    }

    loadModel()

    // 창문 목록 로드
    fetch('/analysis/windows')
      .then(r => r.json())
      .then(data => {
        const container = document.getElementById('win-items')
        if (!data.length) { container.innerHTML = '데이터 없음'; return }
        container.innerHTML = data.slice(0, 50).map(w => `
          <div class="win-item">
            <img class="win-thumb"
                 src="/static/results/${w.window_id}_crop.jpg"
                 onerror="this.style.display='none'">
            <div>
              <div style="font-size:13px">${w.window_id}</div>
              <div style="font-size:11px;color:#888">
                idx: ${w.pollution_index?.toFixed(3) ?? '-'}
              </div>
              <div class="grade-${w.grade}" style="font-size:12px">
                등급 ${w.grade}
              </div>
            </div>
          </div>
        `).join('')
      })
      .catch(() => {
        document.getElementById('win-items').innerHTML = '데이터 로드 실패'
      })

    // 리사이즈
    window.addEventListener('resize', () => {
      camera.aspect = (window.innerWidth - 250) / window.innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(window.innerWidth - 250, window.innerHeight)
    })

    // 애니메이션
    function animate() {
      requestAnimationFrame(animate)
      controls.update()
      renderer.render(scene, camera)
    }
    animate()
  </script>
</body>
</html>
