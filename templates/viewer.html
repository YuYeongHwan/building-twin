<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>3D 뷰어 - Building Twin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; font-family: Arial, sans-serif; overflow: hidden; }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    #info {
      position: fixed;
      top: 16px;
      left: 16px;
      color: #e0e0e0;
      background: rgba(10, 10, 20, 0.80);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 13px;
      backdrop-filter: blur(6px);
      min-width: 200px;
      z-index: 10;
    }
    #info h3 { margin: 0 0 10px; font-size: 14px; color: #fff; }
    .info-row { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 5px; }
    .info-row .lbl { color: #aaa; }
    .info-row .val { font-weight: 700; color: #fff; }
    .grade-chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .chip { padding: 2px 9px; border-radius: 12px; font-size: 11px; font-weight: 700; }
    .chip-A { background: #1a4a1a; color: #4caf50; }
    .chip-B { background: #4a4a1a; color: #ffeb3b; }
    .chip-C { background: #4a2a10; color: #ff9800; }
    .chip-D { background: #4a1010; color: #f44336; }

    #hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #888;
      font-size: 11px;
      background: rgba(0,0,0,0.55);
      padding: 5px 14px;
      border-radius: 20px;
      pointer-events: none;
      z-index: 10;
    }

    #nav-back {
      position: fixed;
      top: 16px;
      right: 16px;
      background: rgba(30, 40, 100, 0.85);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      z-index: 10;
    }
    #nav-back:hover { background: rgba(50, 70, 160, 0.9); }

    /* 우측 창문 패널 */
    #panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 260px;
      height: 100vh;
      background: rgba(10, 10, 20, 0.88);
      border-left: 1px solid #222;
      display: flex;
      flex-direction: column;
      z-index: 10;
      backdrop-filter: blur(8px);
    }
    #panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid #222;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }
    #panel-header small { color: #666; font-weight: 400; margin-left: 6px; }
    #window-list {
      overflow-y: auto;
      flex: 1;
      padding: 6px;
    }
    #window-list::-webkit-scrollbar { width: 4px; }
    #window-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    .win-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 7px;
      margin-bottom: 3px;
      background: #1a1a26;
      border: 1px solid #222;
    }
    .win-item:hover { background: #22223a; }
    .win-id { font-size: 12px; color: #ccc; font-family: monospace; }
    .win-right { text-align: right; }
    .win-idx { font-size: 11px; color: #777; margin-bottom: 2px; }
    .win-badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
    }
    .panel-empty { text-align: center; color: #444; font-size: 12px; padding: 30px 12px; }

    /* 로딩/에러 */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #aaa;
      font-size: 14px;
      z-index: 5;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #222;
      border-top-color: #6c8fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="loader">
  <div class="spinner"></div>
  <div id="loader-text">.splat 모델 로딩 중...</div>
</div>

<div id="info" style="display:none">
  <h3>전체 통계</h3>
  <div class="info-row"><span class="lbl">총 창문</span><span class="val" id="i-total">-</span></div>
  <div class="info-row"><span class="lbl">평균 오염도</span><span class="val" id="i-avg">-</span></div>
  <div class="grade-chips" id="i-grades"></div>
</div>

<div id="hint">드래그: 회전 &nbsp;|&nbsp; 휠: 줌 &nbsp;|&nbsp; 우클릭 드래그: 패닝</div>

<a href="/dashboard" id="nav-back">← 대시보드</a>

<div id="panel">
  <div id="panel-header">창문 오염도 목록 <small id="panel-cnt"></small></div>
  <div id="window-list"><div class="panel-empty">로딩 중…</div></div>
</div>

<script type="module">
  import * as GaussianSplats3D from 'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@latest/build/gaussian-splats-3d.module.js';

  const loaderEl   = document.getElementById('loader');
  const loaderText = document.getElementById('loader-text');
  const infoEl     = document.getElementById('info');

  // ── 3D 뷰어 초기화 ──────────────────────────────────────────
  (async () => {
    try {
      const viewer = new GaussianSplats3D.Viewer({
        cameraUp:               [0, -1, 0],
        initialCameraPosition:  [0, 0, 5],
        initialCameraLookAt:    [0, 0, 0],
        rootElement:            document.getElementById('canvas-container'),
        selfDrivenMode:         true,
        useBuiltInControls:     true,
      });

      loaderText.textContent = '.splat 파일 파싱 중…';
      await viewer.addSplatScene('/models/splat', { streamView: true });

      viewer.start();
      loaderEl.style.display = 'none';
      infoEl.style.display   = 'block';

    } catch (err) {
      loaderText.innerHTML =
        `<span style="color:#f44">모델 로드 실패</span><br>
         <small style="color:#666;font-size:12px">${err.message ?? err}</small><br><br>
         <small style="font-size:11px">pipeline/reconstruct.py 를 먼저 실행하세요.</small>`;
      document.querySelector('.spinner').style.display = 'none';
      console.error(err);
    }
  })();

  // ── 창문 오염도 패널 ─────────────────────────────────────────
  const GRADE_COLOR = { A: '#4caf50', B: '#ffeb3b', C: '#ff9800', D: '#f44336' };
  const GRADE_BG    = { A: '#1a4a1a', B: '#4a4a1a', C: '#4a2a10', D: '#4a1010' };

  (async () => {
    try {
      const res     = await fetch('/analysis/windows');
      const windows = await res.json();

      const listEl = document.getElementById('window-list');
      const cntEl  = document.getElementById('panel-cnt');

      if (!Array.isArray(windows) || !windows.length) {
        listEl.innerHTML = '<div class="panel-empty">분석 결과 없음.<br>파이프라인을 먼저 실행하세요.</div>';
        return;
      }

      const total     = windows.length;
      const indices   = windows.map(w => w.pollution_index ?? w.contamination_score ?? 0);
      const avg       = indices.reduce((s, v) => s + v, 0) / total;
      const gradeCnt  = { A: 0, B: 0, C: 0, D: 0 };
      windows.forEach(w => { gradeCnt[w.grade] = (gradeCnt[w.grade] || 0) + 1; });

      document.getElementById('i-total').textContent = total;
      document.getElementById('i-avg').textContent   = avg.toFixed(3);
      document.getElementById('i-grades').innerHTML  =
        Object.entries(gradeCnt)
          .filter(([, n]) => n > 0)
          .map(([g, n]) => `<span class="chip chip-${g}">${g}: ${n}</span>`)
          .join('');

      cntEl.textContent = `${total}개`;

      listEl.innerHTML = windows.map(w => {
        const idx   = (w.pollution_index ?? w.contamination_score ?? 0).toFixed(3);
        const grade = w.grade ?? 'D';
        const color = GRADE_COLOR[grade] ?? '#aaa';
        const bg    = GRADE_BG[grade]    ?? '#333';
        const img   = w.crop_image_path
          ? `<img src="${w.crop_image_path}" style="width:36px;height:36px;object-fit:cover;border-radius:4px;margin-right:8px;border:1px solid #333" onerror="this.style.display='none'">`
          : '';
        return `
          <div class="win-item">
            ${img}
            <div class="win-id">${w.window_id}</div>
            <div class="win-right">
              <div class="win-idx">idx: ${idx}</div>
              <span class="win-badge" style="background:${bg};color:${color}">등급 ${grade}</span>
            </div>
          </div>`;
      }).join('');

    } catch (err) {
      document.getElementById('window-list').innerHTML =
        `<div class="panel-empty">데이터 로드 실패<br><small>${err.message}</small></div>`;
    }
  })();
</script>
</body>
</html>
